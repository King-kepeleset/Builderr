name: builder

on:
  workflow_dispatch:
    inputs:
      project_type:
        description: 'auto / flutter / native / web2apk'
        required: false
        default: 'auto'
      app_name:
        required: false
        default: ''
      package_name:
        required: false
        default: ''
      version_name:
        required: false
        default: ''
      version_code:
        required: false
        default: ''
      build_type:
        required: false
        default: 'release'
      website_url:
        required: false
        default: ''
      chat_id:
        required: false
        default: ''
      bot_token:
        required: false
        default: ''
  push:
    branches: [build]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ═══════════════ ENV SETUP ═══════════════
      - name: Android SDK Env
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "SDK=$SDK" >> $GITHUB_ENV
          find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 > /tmp/sdkmgr
          SDKMGR=$(cat /tmp/sdkmgr 2>/dev/null || true)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          fi
          echo "SDKMGR=$SDKMGR" >> $GITHUB_ENV

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick jq unzip curl zip >/dev/null

      - name: Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=Builder, O=Builder, C=ID" 2>/dev/null

      # ═══════════════ RESOLVE CONFIG ═══════════════
      - name: Resolve Config
        id: cfg
        shell: bash
        run: |
          set +e
          PT="${{ github.event.inputs.project_type }}"; [ -z "$PT" ] && PT="auto"
          APP="${{ github.event.inputs.app_name }}"
          PKG="${{ github.event.inputs.package_name }}"
          VN="${{ github.event.inputs.version_name }}"
          VC="${{ github.event.inputs.version_code }}"
          BT="${{ github.event.inputs.build_type }}"; [ -z "$BT" ] && BT="release"
          URL="${{ github.event.inputs.website_url }}"
          CHAT="${{ github.event.inputs.chat_id }}"
          TOKEN="${{ github.event.inputs.bot_token }}"

          for f in build-config.json config.json builder.json app.json; do
            if [ -f "$f" ]; then
              echo "::group::$f"; cat "$f"; echo "::endgroup::"
              [ -z "$APP" ] && APP=$(jq -r '.app_name // .name // empty' "$f" 2>/dev/null)
              [ -z "$PKG" ] && PKG=$(jq -r '.package_name // .package // .applicationId // empty' "$f" 2>/dev/null)
              [ -z "$VN" ]  && VN=$(jq -r '.version_name // .version // empty' "$f" 2>/dev/null)
              [ -z "$VC" ]  && VC=$(jq -r '.version_code // empty' "$f" 2>/dev/null)
              [ -z "$URL" ] && URL=$(jq -r '.url // .website // .web_url // empty' "$f" 2>/dev/null)
              [ -z "$BT" ]  && BT=$(jq -r '.build_type // empty' "$f" 2>/dev/null)
              if [ "$PT" = "auto" ]; then
                T=$(jq -r '.type // empty' "$f" 2>/dev/null); [ -n "$T" ] && PT="$T"
              fi
            fi
          done

          [ -z "$APP" ] && APP="SyncXxX"
          [ -z "$PKG" ] && PKG="com.builder.app"
          [ -z "$VN" ]  && VN="1.0.0"
          [ -z "$VC" ]  && VC="1"
          [ -z "$BT" ]  && BT="release"

          # Auto-detect project type
          if [ "$PT" = "auto" ] || [ -z "$PT" ]; then
            if [ -f pubspec.yaml ] || [ -f flutter-project.zip ] || ls *.zip 2>/dev/null | grep -qi flutter; then
              PT="flutter"
            elif [ -f package.json ] && (grep -q '"react-native"' package.json 2>/dev/null || grep -q '"@capacitor/core"' package.json 2>/dev/null); then
              PT="native"
            elif [ -f android/gradlew ] || [ -d android/app ] || [ -f build.gradle ] || [ -f settings.gradle ]; then
              PT="native"
            elif [ -n "$URL" ]; then
              PT="web2apk"
            else
              # Cek isi zip
              ZIP=$(ls *.zip 2>/dev/null | head -1)
              if [ -n "$ZIP" ]; then
                if unzip -l "$ZIP" 2>/dev/null | grep -q 'pubspec.yaml'; then PT="flutter"
                elif unzip -l "$ZIP" 2>/dev/null | grep -q 'android/gradlew'; then PT="native"
                else PT="web2apk"; fi
              else
                PT="web2apk"
              fi
            fi
          fi

          {
            echo "PT=$PT"; echo "APP=$APP"; echo "PKG=$PKG"
            echo "VN=$VN"; echo "VC=$VC"; echo "BT=$BT"
            echo "URL=$URL"; echo "CHAT=$CHAT"; echo "TOKEN=$TOKEN"
          } >> $GITHUB_ENV

          echo "═══════ CONFIG ═══════"
          echo "Type    : $PT"
          echo "App     : $APP"
          echo "Package : $PKG"
          echo "Version : $VN ($VC)"
          echo "Build   : $BT"
          echo "URL     : $URL"
          echo "══════════════════════"

      - name: Notify Start
        if: env.CHAT != '' && env.TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" -d parse_mode="HTML" \
            -d text="⏳ <b>Build Start</b>%0A🏷️ ${APP}%0A📦 <code>${PKG}</code>%0A🔨 ${BT} • ${PT}"

      # ═══════════════ UNZIP (kalau ada ZIP) ═══════════════
      - name: Auto Unzip
        shell: bash
        run: |
          set +e
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ] && [ ! -d "src" ]; then
            echo "📦 Found ZIP: $ZIP"
            mkdir -p src
            unzip -q "$ZIP" -d src 2>/dev/null
            # Ratakan kalau cuma 1 folder
            CNT=$(find src -mindepth 1 -maxdepth 1 | wc -l)
            FIRST=$(find src -mindepth 1 -maxdepth 1 -type d | head -1)
            if [ "$CNT" = "1" ] && [ -n "$FIRST" ] && [ -z "$(find src -mindepth 1 -maxdepth 1 -type f)" ]; then
              TMP=$(mktemp -d); cp -R "$FIRST"/. "$TMP"/; rm -rf src; mkdir -p src; cp -R "$TMP"/. src/
            fi
            # Pindah ke root
            if [ -f src/pubspec.yaml ] || [ -f src/android/gradlew ] || [ -d src/android ]; then
              cp -R src/. . 2>/dev/null || true
            fi
          fi
          echo "── Root listing ──"
          ls -la

      # ═══════════════ FLUTTER ═══════════════
      - name: Flutter — Setup Project
        if: env.PT == 'flutter'
        shell: bash
        run: |
          set +e
          if [ -f pubspec.yaml ]; then
            mkdir -p flutter-project
            cp -R . flutter-project/ 2>/dev/null || true
            rm -rf flutter-project/flutter-project flutter-project/src
          elif [ -f flutter-project.zip ]; then
            mkdir -p flutter-project
            unzip -q flutter-project.zip -d flutter-project
            FIRST=$(find flutter-project -mindepth 1 -maxdepth 1 -type d | head -1)
            CNT=$(find flutter-project -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$CNT" = "1" ] && [ -f "$FIRST/pubspec.yaml" ]; then
              TMP=$(mktemp -d); cp -R "$FIRST"/. "$TMP"/; rm -rf flutter-project
              mkdir -p flutter-project; cp -R "$TMP"/. flutter-project/
            fi
          fi
          [ -f flutter-project/pubspec.yaml ] && echo "✓ pubspec.yaml OK" || { echo "❌ pubspec.yaml not found"; exit 1; }

      - name: Flutter — Detect Version
        if: env.PT == 'flutter'
        shell: bash
        run: |
          set +e
          PUB="flutter-project/pubspec.yaml"
          SDK=$(grep -A3 '^environment:' "$PUB" | grep 'sdk:' | head -1 | sed 's/.*sdk:[[:space:]]*//; s/["'"'"']//g')
          DART=$(echo "$SDK" | grep -oE '[0-9]+\.[0-9]+' | head -1)
          FV="3.27.0"
          case "$DART" in
            3.1[0-9]*) FV="3.35.2" ;;
            3.[89]*)   FV="3.35.2" ;;
            3.7*)      FV="3.29.0" ;;
            3.6*)      FV="3.27.0" ;;
            3.5*)      FV="3.24.0" ;;
            3.4*)      FV="3.22.0" ;;
            3.3*)      FV="3.19.0" ;;
            3.2*)      FV="3.16.0" ;;
            3.1*)      FV="3.13.0" ;;
            3.0*)      FV="3.10.0" ;;
          esac
          grep -qE 'webview_flutter:[[:space:]]*(\^|>=)?[45]\.' "$PUB" && FV="3.35.2"
          grep -qE 'geolocator:[[:space:]]*(\^|>=)?1[4-9]\.' "$PUB" && FV="3.35.2"
          grep -qE 'firebase_core:[[:space:]]*(\^|>=)?3\.' "$PUB" && FV="3.35.2"
          echo "FLUTTER_VERSION=$FV" >> $GITHUB_ENV
          echo "Using Flutter $FV"

      - name: Flutter — Setup SDK
        if: env.PT == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter — Build
        if: env.PT == 'flutter'
        shell: bash
        run: |
          set +e
          cd flutter-project
          flutter config --no-analytics >/dev/null 2>&1
          MAX=4; N=0; OK=0
          while [ $N -lt $MAX ] && [ $OK -eq 0 ]; do
            N=$((N+1))
            echo "── Attempt $N/$MAX ──"
            flutter pub get 2>&1 | tee ../pub.log
            if [ ${PIPESTATUS[0]} -eq 0 ]; then
              if [ "$BT" = "release" ]; then flutter build apk --release 2>&1 | tee -a ../pub.log
              else flutter build apk --debug 2>&1 | tee -a ../pub.log; fi
              [ ${PIPESTATUS[0]} -eq 0 ] && OK=1 && break
            fi
            # Auto-fix
            sed -i -E "s/sdk:[[:space:]]*['\"]?[\^>=]*3\.[0-9]+(\.[0-9]+)?['\"]?/sdk: \">=3.6.0 <4.0.0\"/g" pubspec.yaml 2>/dev/null
            grep -q "webview_flutter" ../pub.log 2>/dev/null && sed -i -E "s/webview_flutter:[[:space:]]*['\"]?[^'\"]+['\"]?/webview_flutter: ^4.13.0/g" pubspec.yaml
            grep -q "geolocator" ../pub.log 2>/dev/null && sed -i -E "s/geolocator:[[:space:]]*['\"]?[^'\"]+['\"]?/geolocator: ^13.0.4/g" pubspec.yaml
            grep -q "firebase_core" ../pub.log 2>/dev/null && sed -i -E "s/firebase_core:[[:space:]]*['\"]?[^'\"]+['\"]?/firebase_core: ^2.32.0/g" pubspec.yaml
            grep -q "permission_handler" ../pub.log 2>/dev/null && sed -i -E "s/permission_handler:[[:space:]]*['\"]?[^'\"]+['\"]?/permission_handler: ^11.3.1/g" pubspec.yaml
            grep -q "image_picker" ../pub.log 2>/dev/null && sed -i -E "s/image_picker:[[:space:]]*['\"]?[^'\"]+['\"]?/image_picker: ^1.1.2/g" pubspec.yaml
            rm -f pubspec.lock; rm -rf build .dart_tool
          done
          [ $OK -eq 1 ] && echo "✅ Flutter build OK" || { echo "❌ Flutter gagal"; tail -100 ../pub.log; exit 1; }

      # ═══════════════ NATIVE ═══════════════
      - name: Native — Locate Project
        if: env.PT == 'native'
        shell: bash
        run: |
          set +e
          # Cari folder yang punya gradlew atau build.gradle
          NATIVE_ROOT="."
          if [ ! -f android/gradlew ] && [ ! -f android/build.gradle ] && [ ! -f android/build.gradle.kts ]; then
            FOUND=$(find . -maxdepth 3 -name "gradlew" -type f 2>/dev/null | grep -v "gradle/wrapper" | head -1)
            if [ -n "$FOUND" ]; then
              NATIVE_ROOT=$(dirname "$FOUND")
              echo "Found native root: $NATIVE_ROOT"
            fi
          fi
          # Kalau gradlew ada di folder yang sama dengan android/
          if [ -d "$NATIVE_ROOT/android" ] && [ ! -f "$NATIVE_ROOT/gradlew" ]; then
            [ -f "$NATIVE_ROOT/android/gradlew" ] && NATIVE_ROOT="$NATIVE_ROOT/android"
          fi
          echo "NATIVE_ROOT=$NATIVE_ROOT" >> $GITHUB_ENV

      - name: Native — Patch Config
        if: env.PT == 'native'
        shell: bash
        run: |
          set +e
          cd "${NATIVE_ROOT:-.}"
          M="app/src/main/AndroidManifest.xml"
          [ -f "$M" ] || M="android/app/src/main/AndroidManifest.xml"
          if [ -f "$M" ]; then
            OLD=$(grep -oP '(?<=package=")[^"]+' "$M" | head -1)
            [ -n "$OLD" ] && sed -i "s|$OLD|${PKG}|g" "$M"
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"${APP}\"|g" "$M"
          fi
          for G in app/build.gradle app/build.gradle.kts android/app/build.gradle android/app/build.gradle.kts build.gradle build.gradle.kts; do
            if [ -f "$G" ]; then
              sed -i "s|applicationId \"[^\"]*\"|applicationId \"${PKG}\"|g" "$G"
              sed -i "s|applicationId = \"[^\"]*\"|applicationId = \"${PKG}\"|g" "$G"
              sed -i "s|versionCode [0-9]*|versionCode ${VC}|g" "$G"
              sed -i "s|versionCode = [0-9]*|versionCode = ${VC}|g" "$G"
              sed -i "s|versionName \"[^\"]*\"|versionName \"${VN}\"|g" "$G"
              sed -i "s|versionName = \"[^\"]*\"|versionName = \"${VN}\"|g" "$G"
            fi
          done
          for S in app/src/main/res/values/strings.xml android/app/src/main/res/values/strings.xml; do
            [ -f "$S" ] && sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${APP}</string>|g" "$S"
          done

      - name: Native — Icons
        if: env.PT == 'native'
        shell: bash
        run: |
          set +e
          [ -f generate_icons.py ] && pip install Pillow -q && python3 generate_icons.py || echo "skip icons"

      - name: Native — Fix Gradle Wrapper
        if: env.PT == 'native'
        shell: bash
        run: |
          set +e
          cd "${NATIVE_ROOT:-.}"
          if [ -f gradlew ]; then
            chmod +x gradlew
            # Pastikan wrapper jar ada
            if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
              mkdir -p gradle/wrapper
              curl -sL -o gradle/wrapper/gradle-wrapper.jar \
                "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
            fi
            # Pastikan distributionUrl wajar
            if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
              if grep -qE "gradle-[0-9]+\.[0-9]+" gradle/wrapper/gradle-wrapper.properties; then
                grep -oE "gradle-[0-9]+\.[0-9]+" gradle/wrapper/gradle-wrapper.properties | head -1
              fi
            fi
          fi

      - name: Native — Build
        if: env.PT == 'native'
        shell: bash
        run: |
          set +e
          cd "${NATIVE_ROOT:-.}"
          chmod +x gradlew 2>/dev/null
          if [ "$BT" = "release" ]; then TASK="assembleRelease"; else TASK="assembleDebug"; fi
          if [ -x ./gradlew ]; then
            ./gradlew "$TASK" --no-daemon --stacktrace 2>&1 | tail -200
            RC=${PIPESTATUS[0]}
          else
            gradle "$TASK" --no-daemon --stacktrace 2>&1 | tail -200
            RC=${PIPESTATUS[0]}
          fi
          exit $RC

      # ═══════════════ WEB2APK ═══════════════
      - name: Web2APK — Scaffold
        if: env.PT == 'web2apk'
        shell: bash
        run: |
          set +e
          [ -z "$URL" ] && URL="https://example.com"
          rm -rf project && mkdir -p project/app/src/main/java/com/web2apk/app
          mkdir -p project/app/src/main/res/{layout,values,mipmap-hdpi,mipmap-mdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi}

          cat > project/build.gradle <<'EOF'
          buildscript { repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.7.3' } }
          allprojects { repositories { google(); mavenCentral() } }
          task clean(type: Delete) { delete rootProject.buildDir }
          EOF
          cat > project/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Web2APK"
          include ':app'
          EOF
          echo "org.gradle.jvmargs=-Xmx2048m" > project/gradle.properties
          echo "android.useAndroidX=true" >> project/gradle.properties

          cat > project/app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '${PKG}'
              compileSdk 34
              defaultConfig {
                  applicationId "${PKG}"
                  minSdk 21
                  targetSdk 34
                  versionCode ${VC}
                  versionName "${VN}"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF

          cat > project/app/src/main/java/com/web2apk/app/MainActivity.java <<EOF
          package ${PKG};
          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.*;
          import android.widget.ProgressBar;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipe;
              @SuppressLint("SetJavaScriptEnabled")
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);
                  swipe = findViewById(R.id.swipeRefreshLayout);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView v, String u) { progressBar.setVisibility(View.GONE); swipe.setRefreshing(false); }
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          if (u.startsWith("tel:")||u.startsWith("mailto:")||u.startsWith("whatsapp:")||u.startsWith("intent:")) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); } catch (Exception e) {}
                              return true;
                          }
                          return false;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onProgressChanged(WebView v, int p) {
                          progressBar.setProgress(p);
                          progressBar.setVisibility(p >= 100 ? View.GONE : View.VISIBLE);
                      }
                  });
                  webView.setDownloadListener((url, ua, cd, mt, cl) -> {
                      DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                      r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, cd);
                      ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(r);
                  });
                  swipe.setOnRefreshListener(() -> webView.reload());
                  webView.loadUrl("${URL}");
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) { webView.goBack(); return; }
                  super.onBackPressed();
              }
          }
          EOF

          cat > project/app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application android:allowBackup="true" android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true" android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > project/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical">
              <ProgressBar android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent" android:layout_height="4dp" android:max="100"/>
              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                  android:id="@+id/swipeRefreshLayout"
                  android:layout_width="match_parent" android:layout_height="match_parent">
                  <WebView android:id="@+id/webView"
                      android:layout_width="match_parent" android:layout_height="match_parent"/>
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          </LinearLayout>
          EOF

          cat > project/app/src/main/res/values/strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">${APP}</string></resources>
          EOF
          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
              </style>
          </resources>
          EOF

          # Icons
          if [ ! -f build-assets/icon.png ]; then
            mkdir -p build-assets
            convert -size 512x512 xc:black -fill white -gravity center -pointsize 200 -annotate 0 "A" build-assets/icon.png 2>/dev/null || convert -size 512x512 xc:blue build-assets/icon.png
          fi
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            D=${d%%:*}; S=${d##*:}
            convert build-assets/icon.png -resize ${S}x${S} "project/app/src/main/res/mipmap-$D/ic_launcher.png" 2>/dev/null || true
          done

      - name: Web2APK — Build
        if: env.PT == 'web2apk'
        shell: bash
        run: |
          set +e
          cd project
          if [ -x ./gradlew ]; then
            ./gradlew assembleRelease --no-daemon 2>&1 | tail -100
            exit ${PIPESTATUS[0]}
          else
            gradle wrapper --gradle-version 8.9 >/dev/null 2>&1
            if [ -x ./gradlew ]; then ./gradlew assembleRelease --no-daemon 2>&1 | tail -100
            else gradle assembleRelease --no-daemon 2>&1 | tail -100; fi
            exit ${PIPESTATUS[0]}
          fi

      # ═══════════════ COLLECT + SIGN + UPLOAD ═══════════════
      - name: Collect APK
        shell: bash
        run: |
          set +e
          mkdir -p output
          APK=$(find . -name "*.apk" -not -path "*/intermediates/*" -not -path "*/outputs/apk/*/tmp/*" 2>/dev/null | grep -vE "unaligned|debug-unaligned" | head -1)
          [ -z "$APK" ] && APK=$(find . -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "❌ APK tidak ditemukan"; find . -name "*.apk" 2>/dev/null; exit 1; fi
          cp "$APK" "output/${APP}_v${VN}_${BT}.apk"
          echo "APK_FILE=output/${APP}_v${VN}_${BT}.apk" >> $GITHUB_ENV
          ls -la output/

      - name: Sign APK
        if: env.BT == 'release'
        shell: bash
        run: |
          set +e
          APK="${APK_FILE}"
          BT_DIR=$(ls $SDK/build-tools 2>/dev/null | sort -V | tail -1)
          ZA="$SDK/build-tools/$BT_DIR/zipalign"
          AS="$SDK/build-tools/$BT_DIR/apksigner"
          if [ -x "$ZA" ] && [ -x "$AS" ]; then
            "$ZA" -f -p 4 "$APK" "${APK}.aligned" && mv "${APK}.aligned" "$APK"
            "$AS" sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK" 2>&1 | tail -3
            "$AS" verify "$APK" 2>&1 | tail -3
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-v${{ env.VN }}-${{ env.BT }}
          path: output/*.apk
          retention-days: 30

      - name: Send to Telegram
        if: env.CHAT != '' && env.TOKEN != '' && success()
        shell: bash
        run: |
          set +e
          APK="${APK_FILE}"
          SIZE=$(du -sh "$APK" | cut -f1)
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendDocument" \
            -F chat_id="${CHAT}" \
            -F document=@"$APK" \
            -F parse_mode="HTML" \
            -F caption="✅ <b>Build Success</b>%0A🏷️ ${APP}%0A📦 <code>${PKG}</code>%0A🔢 ${VN} (${VC})%0A🔨 ${BT} • ${PT}%0A📁 ${SIZE}"

      - name: Notify Failure
        if: failure() && env.CHAT != '' && env.TOKEN != ''
        shell: bash
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" -d parse_mode="HTML" \
            -d text="❌ <b>Build Gagal</b>%0A🏷️ ${APP}%0A📂 ${PT}%0A🔗 https://github.com/${{ github.repository }}/actions"
