name: builder

on:
  workflow_dispatch:
    inputs:
      project_type:
        description: 'Jenis Project'
        required: true
        default: 'auto'
        type: choice
        options: [auto, native, web2apk, flutter]
      app_name:
        description: 'Nama Aplikasi (opsional)'
        required: false
        default: ''
      package_name:
        description: 'Package Name (opsional)'
        required: false
        default: ''
      version_name:
        description: 'Version Name (opsional)'
        required: false
        default: ''
      version_code:
        description: 'Version Code (opsional)'
        required: false
        default: ''
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options: [release, debug]
      website_url:
        description: 'Website URL (khusus Web2APK)'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID (opsional)'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token (opsional)'
        required: false
        default: ''
  push:
    branches: [build]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      # ===================== CHECKOUT =====================
      - name: Checkout
        uses: actions/checkout@v4

      # ===================== RESOLVE CONFIG =====================
      - name: Resolve Configuration
        shell: bash
        run: |
          set +e
          PTYPE="${{ github.event.inputs.project_type }}"
          APP_NAME="${{ github.event.inputs.app_name }}"
          PKG="${{ github.event.inputs.package_name }}"
          VNAME="${{ github.event.inputs.version_name }}"
          VCODE="${{ github.event.inputs.version_code }}"
          BTYPE="${{ github.event.inputs.build_type }}"
          WEB_URL="${{ github.event.inputs.website_url }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          BOT_TOKEN="${{ github.event.inputs.bot_token }}"

          if [ -f build-config.json ]; then
            echo "::group::build-config.json"
            cat build-config.json
            echo "::endgroup::"
            if [ -z "$PTYPE" ] || [ "$PTYPE" = "auto" ]; then
              T=$(jq -r '.type // empty' build-config.json); [ -n "$T" ] && PTYPE="$T"
            fi
            [ -z "$APP_NAME" ] && APP_NAME=$(jq -r '.app_name // empty' build-config.json)
            [ -z "$PKG" ]      && PKG=$(jq -r '.package_name // empty' build-config.json)
            [ -z "$VNAME" ]    && VNAME=$(jq -r '.version_name // empty' build-config.json)
            [ -z "$VCODE" ]    && VCODE=$(jq -r '.version_code // empty' build-config.json)
            [ -z "$BTYPE" ]    && BTYPE=$(jq -r '.build_type // empty' build-config.json)
            [ -z "$WEB_URL" ]  && WEB_URL=$(jq -r '.url // empty' build-config.json)
          fi

          # Defaults
          [ -z "$APP_NAME" ] && APP_NAME="SyncXxX"
          [ -z "$PKG" ]      && PKG="com.example.app"
          [ -z "$VNAME" ]    && VNAME="1.0.0"
          [ -z "$VCODE" ]    && VCODE="1"
          [ -z "$BTYPE" ]    && BTYPE="release"

          # Auto-detect
          if [ -z "$PTYPE" ] || [ "$PTYPE" = "auto" ] || [ "$PTYPE" = "null" ]; then
            if [ -f pubspec.yaml ] || [ -f flutter-project.zip ]; then
              PTYPE="flutter"
            elif [ -f android/gradlew ] || [ -d android/app ]; then
              PTYPE="native"
            elif [ -f web2apk-config.json ] || [ -d web2apk ]; then
              PTYPE="web2apk"
            else
              PTYPE="native"
            fi
          fi

          # Simpan ke env
          {
            echo "PTYPE=$PTYPE"
            echo "APP_NAME=$APP_NAME"
            echo "PKG=$PKG"
            echo "VNAME=$VNAME"
            echo "VCODE=$VCODE"
            echo "BTYPE=$BTYPE"
            echo "WEB_URL=$WEB_URL"
            echo "CHAT_ID=$CHAT_ID"
            echo "BOT_TOKEN=$BOT_TOKEN"
          } >> $GITHUB_ENV

          echo "═══════════ Build Config ═══════════"
          echo "Jenis Project : $PTYPE"
          echo "App Name      : $APP_NAME"
          echo "Package       : $PKG"
          echo "Version       : $VNAME ($VCODE)"
          echo "Build Type    : $BTYPE"
          echo "Website URL   : $WEB_URL"
          echo "════════════════════════════════════"

      # ===================== NOTIFY START =====================
      - name: Notify Start
        if: env.CHAT_ID != '' && env.BOT_TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
            -d text="⏳ <b>Build dimulai!</b>%0A%0A🏷️ App: <code>${APP_NAME}</code>%0A📦 Package: <code>${PKG}</code>%0A🔢 Versi: <code>${VNAME}</code>+<code>${VCODE}</code>%0A🔨 Tipe: <code>${BTYPE}</code>%0A📂 Jenis: <code>${PTYPE}</code>"

      # ===================== SETUP =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        if: env.PTYPE == 'native'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq unzip curl zip

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      # ══════════════════════════════════════════════════════
      #                     NATIVE ANDROID
      # ══════════════════════════════════════════════════════
      - name: NATIVE — Install Pillow
        if: env.PTYPE == 'native'
        run: pip install Pillow

      - name: NATIVE — Generate Icons
        if: env.PTYPE == 'native'
        run: python3 generate_icons.py || echo "generate_icons.py tidak ada, skip"

      - name: NATIVE — Patch AndroidManifest.xml
        if: env.PTYPE == 'native'
        run: |
          M="android/app/src/main/AndroidManifest.xml"
          if [ -f "$M" ]; then
            OLD=$(grep -oP '(?<=package=")[^"]+' "$M" | head -1)
            [ -n "$OLD" ] && sed -i "s|$OLD|${PKG}|g" "$M"
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"${APP_NAME}\"|g" "$M"
          fi

      - name: NATIVE — Patch build.gradle
        if: env.PTYPE == 'native'
        run: |
          G="android/app/build.gradle"
          [ -f "$G" ] || G="android/app/build.gradle.kts"
          if [ -f "$G" ]; then
            sed -i "s|applicationId \"[^\"]*\"|applicationId \"${PKG}\"|" "$G"
            sed -i "s|versionCode [0-9]*|versionCode ${VCODE}|" "$G"
            sed -i "s|versionName \"[^\"]*\"|versionName \"${VNAME}\"|" "$G"
          fi

      - name: NATIVE — Patch strings.xml
        if: env.PTYPE == 'native'
        run: |
          S="android/app/src/main/res/values/strings.xml"
          [ -f "$S" ] && sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${APP_NAME}</string>|g" "$S"

      - name: NATIVE — Setup Gradle Wrapper
        if: env.PTYPE == 'native'
        run: |
          mkdir -p android/gradle/wrapper
          [ -f android/gradle/wrapper/gradle-wrapper.jar ] || \
            curl -L -o android/gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x android/gradlew || true

      - name: NATIVE — Build APK
        if: env.PTYPE == 'native'
        run: |
          cd android
          if [ "$BTYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      # ══════════════════════════════════════════════════════
      #                        WEB2APK
      # ══════════════════════════════════════════════════════
      - name: WEB2APK — Create root gradle files
        if: env.PTYPE == 'web2apk'
        run: |
          mkdir -p project
          cat > project/build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.7.3' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          task clean(type: Delete) { delete rootProject.buildDir }
          EOF
          cat > project/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MyApp"
          include ':app'
          EOF
          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: WEB2APK — Create app/build.gradle
        if: env.PTYPE == 'web2apk'
        run: |
          mkdir -p project/app
          cat > project/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.web2apk.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.web2apk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.webkit:webkit:1.4.0'
          }
          EOF

      - name: WEB2APK — Create Java sources
        if: env.PTYPE == 'web2apk'
        run: |
          mkdir -p project/app/src/main/java/com/web2apk/app
          cat > project/app/src/main/java/com/web2apk/app/MainActivity.java <<'EOF'
          package com.web2apk.app;
          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.Toolbar;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          public class MainActivity extends AppCompatActivity {
              private static final String WEBSITE_URL = "URL_PLACEHOLDER";
              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipeRefreshLayout;
              @SuppressLint("SetJavaScriptEnabled")
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);
                  swipeRefreshLayout = findViewById(R.id.swipeRefreshLayout);
                  Toolbar toolbar = findViewById(R.id.toolbar);
                  setSupportActionBar(toolbar);
                  if (getSupportActionBar() != null) getSupportActionBar().setTitle(getString(R.string.app_name));
                  setupWebView();
                  swipeRefreshLayout.setOnRefreshListener(() -> webView.reload());
                  webView.loadUrl(WEBSITE_URL);
              }
              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(webView, true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView v, String u) { progressBar.setVisibility(View.GONE); swipeRefreshLayout.setRefreshing(false); }
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String url = r.getUrl().toString();
                          if (url.startsWith("tel:")||url.startsWith("mailto:")||url.startsWith("intent:")||url.startsWith("whatsapp:")) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onProgressChanged(WebView v, int p) {
                          progressBar.setProgress(p);
                          progressBar.setVisibility(p >= 100 ? View.GONE : View.VISIBLE);
                      }
                  });
                  webView.setDownloadListener((url, ua, cd, mt, cl) -> {
                      DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                      r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, cd);
                      ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(r);
                  });
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
              }
              @Override public void onBackPressed() { if (webView != null && webView.canGoBack()) { webView.goBack(); return; } super.onBackPressed(); }
              @Override protected void onResume() { if (webView != null) webView.onResume(); }
              @Override protected void onPause() { if (webView != null) webView.onPause(); super.onPause(); }
              @Override protected void onDestroy() { if (webView != null) webView.destroy(); super.onDestroy(); }
          }
          EOF
          cat > project/app/src/main/java/com/web2apk/app/SplashActivity.java <<'EOF'
          package com.web2apk.app;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import androidx.appcompat.app.AppCompatActivity;
          public class SplashActivity extends AppCompatActivity {
              private static final int SPLASH_DELAY = 1800;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);
                  new Handler().postDelayed(() -> {
                      startActivity(new Intent(SplashActivity.this, MainActivity.class));
                      finish();
                  }, SPLASH_DELAY);
              }
          }
          EOF

      - name: WEB2APK — Create manifest & resources
        if: env.PTYPE == 'web2apk'
        run: |
          mkdir -p project/app/src/main/res/layout
          mkdir -p project/app/src/main/res/values
          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity android:name=".SplashActivity" android:exported="true" android:theme="@style/SplashTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".MainActivity" android:exported="false"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode" />
              </application>
          </manifest>
          EOF
          cat > project/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical">
              <androidx.appcompat.widget.Toolbar android:id="@+id/toolbar"
                  android:layout_width="match_parent" android:layout_height="56dp"
                  android:background="#000000" app:titleTextColor="#FFFFFF"/>
              <ProgressBar android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent" android:layout_height="4dp" android:max="100"/>
              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                  android:id="@+id/swipeRefreshLayout"
                  android:layout_width="match_parent" android:layout_height="match_parent">
                  <WebView android:id="@+id/webView"
                      android:layout_width="match_parent" android:layout_height="match_parent"/>
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          </LinearLayout>
          EOF
          cat > project/app/src/main/res/layout/activity_splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#000000">
              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_centerInParent="true" android:gravity="center" android:orientation="vertical">
                  <ImageView android:id="@+id/splashLogo"
                      android:layout_width="120dp" android:layout_height="120dp"
                      android:src="@mipmap/ic_launcher" />
                  <TextView android:id="@+id/splashAppName"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="@string/app_name" android:textSize="26sp"
                      android:textStyle="bold" android:textColor="#FFFFFF" android:layout_marginTop="20dp" />
                  <ProgressBar android:id="@+id/splashProgress"
                      android:layout_width="40dp" android:layout_height="40dp" android:layout_marginTop="30dp" />
              </LinearLayout>
          </RelativeLayout>
          EOF
          cat > project/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#000000</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#2196F3</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
          </resources>
          EOF
          cat > project/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">AppName</string>
              <string name="loading">Loading...</string>
          </resources>
          EOF
          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="SplashTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

      - name: WEB2APK — Apply config, icons, keystore
        if: env.PTYPE == 'web2apk'
        run: |
          sed -i "s|URL_PLACEHOLDER|${WEB_URL}|g" project/app/src/main/java/com/web2apk/app/MainActivity.java
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${APP_NAME}</string>|g" project/app/src/main/res/values/strings.xml
          sed -i "s|applicationId \"com.web2apk.app\"|applicationId \"${PKG}\"|" project/app/build.gradle
          sed -i "s|namespace 'com.web2apk.app'|namespace '${PKG}'|" project/app/build.gradle
          sed -i "s|versionCode 1|versionCode ${VCODE}|" project/app/build.gradle
          sed -i "s|versionName \"1.0\"|versionName \"${VNAME}\"|" project/app/build.gradle

          if [ ! -f build-assets/icon.png ]; then
            echo "⚠️ Icon tidak ada, buat default..."
            mkdir -p build-assets
            convert -size 512x512 xc:blue build-assets/icon.png
          fi
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            D=${d%%:*}; S=${d##*:}
            mkdir -p "project/app/src/main/res/mipmap-$D"
            convert build-assets/icon.png -resize ${S}x${S} "project/app/src/main/res/mipmap-$D/ic_launcher.png"
            cp "project/app/src/main/res/mipmap-$D/ic_launcher.png" "project/app/src/main/res/mipmap-$D/ic_launcher_round.png"
          done
          rm -f project/app/debug.keystore
          keytool -genkey -v -keystore project/app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: WEB2APK — Build
        if: env.PTYPE == 'web2apk'
        run: |
          cd project
          gradle wrapper --gradle-version 8.9 || true
          if [ -x ./gradlew ]; then ./gradlew assembleRelease --no-daemon
          else gradle assembleRelease --no-daemon; fi

      # ══════════════════════════════════════════════════════
      #                         FLUTTER
      # ══════════════════════════════════════════════════════
      - name: FLUTTER — Prepare project
        if: env.PTYPE == 'flutter'
        run: |
          rm -rf flutter-project
          if [ -f flutter-project.zip ]; then
            mkdir -p flutter-project
            unzip -q flutter-project.zip -d flutter-project
            FIRST_DIR=$(find flutter-project -mindepth 1 -maxdepth 1 -type d | head -n 1)
            ROOT_FILES=$(find flutter-project -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$ROOT_FILES" = "1" ] && [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/pubspec.yaml" ]; then
              TMP=$(mktemp -d); cp -R "$FIRST_DIR"/. "$TMP"/; rm -rf flutter-project
              mkdir -p flutter-project; cp -R "$TMP"/. flutter-project/
            fi
          else
            mkdir -p flutter-project
            cp -R . flutter-project/ 2>/dev/null || true
          fi
          [ -f flutter-project/pubspec.yaml ] || { echo "❌ pubspec.yaml tidak ditemukan"; exit 1; }

      - name: FLUTTER — Detect version
        if: env.PTYPE == 'flutter'
        id: flutter_detect
        shell: bash
        run: |
          set -e
          PUB="flutter-project/pubspec.yaml"
          SDK_LINE=$(grep -A2 '^environment:' "$PUB" | grep 'sdk:' | head -n1 | sed 's/.*sdk:[[:space:]]*//; s/["'\'']//g' || true)
          echo "Detected SDK: $SDK_LINE"
          FLUTTER_VERSION="3.27.0"
          DART_VERSION=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          if [ -n "$DART_VERSION" ]; then
            case "$DART_VERSION" in
              3.1[0-9]*) FLUTTER_VERSION="3.35.2" ;;
              3.[89]*)   FLUTTER_VERSION="3.35.2" ;;
              3.7*)      FLUTTER_VERSION="3.29.0" ;;
              3.6*)      FLUTTER_VERSION="3.27.0" ;;
              3.5*)      FLUTTER_VERSION="3.24.0" ;;
              3.4*)      FLUTTER_VERSION="3.22.0" ;;
              3.3*)      FLUTTER_VERSION="3.19.0" ;;
              3.2*)      FLUTTER_VERSION="3.16.0" ;;
              3.1*)      FLUTTER_VERSION="3.13.0" ;;
              3.0*)      FLUTTER_VERSION="3.10.0" ;;
            esac
          fi
          # Plugin override
          grep -Eq 'webview_flutter:[[:space:]]*(\^|>=)?[45]\.' "$PUB" && FLUTTER_VERSION="3.35.2" || true
          grep -Eq 'geolocator:[[:space:]]*(\^|>=)?1[4-9]\.' "$PUB" && FLUTTER_VERSION="3.35.2" || true
          grep -Eq 'firebase_core:[[:space:]]*(\^|>=)?3\.' "$PUB" && FLUTTER_VERSION="3.35.2" || true
          grep -Eq 'permission_handler:[[:space:]]*(\^|>=)?12\.' "$PUB" && FLUTTER_VERSION="3.35.2" || true
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV
          echo "Using Flutter $FLUTTER_VERSION"

      - name: FLUTTER — Setup SDK
        if: env.PTYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: FLUTTER — Build with auto-fix
        if: env.PTYPE == 'flutter'
        shell: bash
        run: |
          set -e
          cd flutter-project
          flutter --version
          PUB_LOG="../pubget.log"
          MAX=5; N=0; OK=false
          try_get() { flutter pub get 2>&1 | tee "$PUB_LOG"; return ${PIPESTATUS[0]}; }
          fix() {
            F=false
            if grep -q "requires SDK version" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s/sdk:[[:space:]]*['\"]?[\^>=]*3\.[0-9]+(\.[0-9]+)?['\"]?/sdk: \">=3.6.0 <4.0.0\"/g" pubspec.yaml || true
              F=true
            fi
            grep -q "webview_flutter" "$PUB_LOG" 2>/dev/null && sed -i -E "s/webview_flutter:[[:space:]]*['\"]?[^'\"]+['\"]?/webview_flutter: ^4.13.0/g" pubspec.yaml || true
            grep -q "geolocator" "$PUB_LOG" 2>/dev/null && sed -i -E "s/geolocator:[[:space:]]*['\"]?[^'\"]+['\"]?/geolocator: ^13.0.4/g" pubspec.yaml || true
            grep -q "firebase_core" "$PUB_LOG" 2>/dev/null && sed -i -E "s/firebase_core:[[:space:]]*['\"]?[^'\"]+['\"]?/firebase_core: ^2.32.0/g" pubspec.yaml || true
            grep -q "permission_handler" "$PUB_LOG" 2>/dev/null && sed -i -E "s/permission_handler:[[:space:]]*['\"]?[^'\"]+['\"]?/permission_handler: ^11.3.1/g" pubspec.yaml || true
            grep -q "image_picker" "$PUB_LOG" 2>/dev/null && sed -i -E "s/image_picker:[[:space:]]*['\"]?[^'\"]+['\"]?/image_picker: ^1.1.2/g" pubspec.yaml || true
            grep -q "file_picker" "$PUB_LOG" 2>/dev/null && sed -i -E "s/file_picker:[[:space:]]*['\"]?[^'\"]+['\"]?/file_picker: ^6.2.1/g" pubspec.yaml || true
            grep -q "google_maps_flutter" "$PUB_LOG" 2>/dev/null && sed -i -E "s/google_maps_flutter:[[:space:]]*['\"]?[^'\"]+['\"]?/google_maps_flutter: ^2.9.0/g" pubspec.yaml || true
            [ "$F" = true ] && rm -f pubspec.lock
          }
          while [ $N -lt $MAX ] && [ "$OK" = false ]; do
            N=$((N+1)); echo "=== Attempt $N/$MAX ==="
            if try_get; then
              if [ "$BTYPE" = "release" ]; then CMD="flutter build apk --release"
              else CMD="flutter build apk --debug"; fi
              if $CMD; then OK=true; break
              else echo "❌ build fail, fix..."; fix; rm -rf build .dart_tool; fi
            else
              echo "❌ pub get fail, fix..."; fix; rm -f pubspec.lock
            fi
          done
          [ "$OK" = true ] || { echo "Build gagal setelah $MAX percobaan"; cat "$PUB_LOG" || true; exit 1; }

      # ══════════════════════════════════════════════════════
      #                  COLLECT + SIGN + UPLOAD
      # ══════════════════════════════════════════════════════
      - name: Collect APK
        run: |
          mkdir -p output
          FOUND=""
          case "$PTYPE" in
            native)
              if [ "$BTYPE" = "release" ]; then SRC="android/app/build/outputs/apk/release"
              else SRC="android/app/build/outputs/apk/debug"; fi ;;
            web2apk)
              SRC="project/app/build/outputs/apk/release" ;;
            flutter)
              SRC="flutter-project/build/app/outputs/flutter-apk" ;;
          esac
          echo "Mencari APK di: $SRC"
          APK=$(find "$SRC" -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -not -path "*/build/intermediates/*" 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then echo "❌ APK tidak ditemukan"; exit 1; fi
          cp "$APK" "output/${APP_NAME}_v${VNAME}_${BTYPE}.apk"
          echo "APK_FILE=output/${APP_NAME}_v${VNAME}_${BTYPE}.apk" >> $GITHUB_ENV
          ls -la output/

      - name: Sign APK (release)
        if: env.BTYPE == 'release'
        run: |
          APK="${APK_FILE}"
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          ZA="$ANDROID_HOME/build-tools/$BT/zipalign"
          AS="$ANDROID_HOME/build-tools/$BT/apksigner"
          if [ -x "$ZA" ] && [ -x "$AS" ]; then
            "$ZA" -f -p 4 "$APK" "${APK}.aligned"
            mv "${APK}.aligned" "$APK"
            "$AS" sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK" || true
            "$AS" verify "$APK" || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ env.VNAME }}-${{ env.BTYPE }}
          path: output/*.apk
          retention-days: 30

      - name: Send APK to Telegram
        if: env.CHAT_ID != '' && env.BOT_TOKEN != ''
        run: |
          APK="${APK_FILE}"
          SIZE=$(du -sh "$APK" | cut -f1)
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"$APK" \
            -F parse_mode="HTML" \
            -F caption="✅ <b>Build Selesai!</b>%0A%0A🏷️ <b>App:</b> ${APP_NAME}%0A📦 <b>Package:</b> <code>${PKG}</code>%0A🔢 <b>Versi:</b> <code>${VNAME}</code> (code: ${VCODE})%0A🔨 <b>Tipe:</b> <code>${BTYPE}</code>%0A📂 <b>Jenis:</b> <code>${PTYPE}</code>%0A📁 <b>Size:</b> <code>${SIZE}</code>"

      - name: Notify Failure
        if: failure() && env.CHAT_ID != '' && env.BOT_TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
            -d text="❌ <b>Build Gagal!</b>%0A%0A🏷️ App: <code>${APP_NAME}</code>%0A📦 Package: <code>${PKG}</code>%0A📂 Jenis: <code>${PTYPE}</code>%0A%0A🔗 https://github.com/${{ github.repository }}/actions"
